id = "jpmoo/morgan"
name = "Morgan"
version = "0.1.0"
plugin_api = 32
author = "jpmoo"
license = "MIT"
icon = "microphone"
description = "A face for Morgan, the heymorgan voice assistant: a waveform that pops up while Morgan listens, thinks and speaks."
tags = ["voice", "assistant"]
dependencies = ["heymorgan"]

[[setting]]
key = "accent_source"
type = "select"
label_key = "settings.accent_source.label"
description_key = "settings.accent_source.description"
default = "custom"
options = [
  { value = "custom", label_key = "settings.accent_source.custom" },
  { value = "theme", label_key = "settings.accent_source.theme" },
]

[[setting]]
key = "accent"
type = "color"
label_key = "settings.accent.label"
description_key = "settings.accent.description"
default = "#6f9bb3"
visible_when = { key = "accent_source", values = ["custom"] }

[[service]]
id = "link"
entry = "service.luau"

[[widget]]
id = "morgan"
entry = "widget.luau"

[[panel]]
id = "voice"
entry = "voice.luau"
width = 420
# What is drawn, plus the 16 px the shell keeps clear on every side:
# 32 + padding 16 + header 40 + waveform 44 + two gaps of 8, and the rest
# (about 200) for the words. Keep PANEL in voice.luau in step with it.
height = 356
# Not persistent: a persistent panel is always floating, whatever placement
# is chosen for it. The price is that it shares the one slot ordinary panels
# have, so the service does not raise it over Morgan's own windows.
placement = "floating"
position = "bottom_center"
layer = "overlay"
dismiss_on_outside_click = false
keyboard_focus = "none"

[[panel]]
id = "settings"
entry = "settings.luau"
width = 900
height = 740
placement = "floating"
position = "center"
keyboard_focus = "exclusive"

[[panel]]
id = "chat"
entry = "chat.luau"
width = 640
height = 720
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
